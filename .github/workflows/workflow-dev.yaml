name: Build and Deploy

on:
  push:
    branches:
      - dev

jobs:
  auto-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version and push tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          tag_prefix: "v"
          release_branches: "dev"
          github_token: ${{ secrets.GH_PAT }}

  build:
    needs: auto-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Tags
        run: |
          git fetch --tags

      - name: Retrieve Latest Tag
        id: get_tag
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "Latest Tag: $VERSION"
          echo "SEMVER_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.IMAGE_NAME }}:dev \
            -t ${{ secrets.IMAGE_NAME }}:${{ env.SEMVER_VERSION }}-dev .
        working-directory: ${{ github.workspace }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.IMAGE_NAME }}:dev
          docker push ${{ secrets.IMAGE_NAME }}:${{ env.SEMVER_VERSION }}-dev

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to DigitalOcean
        uses: fifsky/ssh-action@master
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          user: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Create Working Directory, Set Up Environment, and Dependencies
        uses: fifsky/ssh-action@master
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          user: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          command: |
            set -e  # Stop script execution on failure
            
            if [ ! -d "${{ secrets.DEV_PROJECT_DIRECTORY }}" ]; then
              mkdir -p ${{ secrets.DEV_PROJECT_DIRECTORY }}
            fi

            cd ${{ secrets.DEV_PROJECT_DIRECTORY }}

            # Create .env.dev file
            echo "${{ secrets.DEV_ENV_FILE_SECRET }}" > .env.development
            echo "Environment variables set."

      - name: Pull Docker-Compose and Run Docker Container
        uses: fifsky/ssh-action@master
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          user: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          command: |
            set -e  # Stop script execution on failure

            cd ${{ secrets.DEV_PROJECT_DIRECTORY }}
            curl -H ${{ secrets.DEV_DOCKER_COMPOSE }}

            echo "Checking if Docker image exists..."
            if docker images --format "{{.Repository}}:{{.Tag}}" | grep -q "^${{ secrets.IMAGE_NAME }}:dev$"; then
                echo "Image found. Deleting..."
                docker rmi -f ${{ secrets.IMAGE_NAME }}:dev
            else
                echo "Image not found, skipping deletion."
            fi

            docker compose -p ${{ secrets.DEV_PROJECT_NAME }} up --force-recreate -d
            docker image prune -a -f

            echo "Deployment completed successfully."
