<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Template</title>
  </head>
  <body
    style="
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 50vh;
    "
  >
    <div>
      <img
        style="width: 300px; object-fit: cover"
        src="https://media.istockphoto.com/id/457892225/ko/%EB%B2%A1%ED%84%B0/%EB%8B%B9%EC%8B%A0%EC%9D%80-mail.jpg?s=612x612&w=0&k=20&c=9EIRqoIG5VAa07wgb54f7WT_VWahjTbkUMfBzygOb_E="
        alt=""
      />
      <p style="color: gray">
        Your Registration Token is :
        <span style="color: green; font-size: 20px; font-weight: bold"
          >5744141</span
        >
      </p>
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin: 1rem 0;
        "
      >
        <span style="width: 130px; height: 2px; background: black"></span>
        <span>OR</span>
        <span style="width: 130px; height: 2px; background: black"></span>
      </div>
      <p style="color: gray; font-weight: 600; text-transform: capitalize;">Verified your email to click here</p>
      <a
        href=""
        target="_blank"
        style="
          background: linear-gradient(90deg, goldenrod, black);
          padding: 0.6rem 2rem;
          border-radius: 50px;
          color: white;
          text-decoration: none;
          font-weight: bold;
        "
      >
        Click
      </a>
    </div>
  </body>
</html>
