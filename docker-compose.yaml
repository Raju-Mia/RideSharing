services:
  dev_api_uc:
    image: "project/uc_backend:latest"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      STRIPE_HOOK_SECRET: ${STRIPE_HOOK_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      AIRLABS_API_KEY: ${AIRLABS_API_KEY}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      ADD_CARD_URL: ${ADD_CARD_URL}
      REDIS_LOCATION: ${REDIS_LOCATION}
      LICENSE_VERIFICATION_PORTAL_URL: ${LICENSE_VERIFICATION_PORTAL_URL}
      ADMIN_PORTAL_URL: ${ADMIN_PORTAL_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      EMAIL_SENDING_URL: ${EMAIL_SENDING_URL}
      EMAIL_SENDER_TOKEN: ${EMAIL_SENDER_TOKEN}
      EMAIL_VERIFICATION_FRONTEND_URL: ${EMAIL_VERIFICATION_FRONTEND_URL}
      URL_TO_SEND_EMAIL_VERIFICATION_URL: ${URL_TO_SEND_EMAIL_VERIFICATION_URL}
      twilio_ac_ACCOUNT_SID: ${twilio_ac_ACCOUNT_SID}
      twilio_ac_AUTH_TOKEN: ${twilio_ac_AUTH_TOKEN}
      twilio_ac_VERIFY_SID: ${twilio_ac_VERIFY_SID}
      DVLA_API_KEY: ${DVLA_API_KEY}
      DVLA_URL: ${DVLA_URL}
    labels:
      - traefik.enable=true
      - traefik.http.routers.dev_api_uc.entrypoints=http
      - traefik.http.routers.dev_api_uc.rule=Host(`api.uc.co.uk`)
      - traefik.http.middlewares.dev_api_uc-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.dev_api_uc.middlewares=dev_api_uc-https-redirect
      - traefik.http.routers.dev_api_uc-secure.entrypoints=https
      - traefik.http.routers.dev_api_uc-secure.rule=Host(`api.uc.co.uk`)
      - traefik.http.routers.dev_api_uc-secure.tls=true
      - traefik.http.routers.dev_api_uc-secure.tls.certresolver=digitalocean
      - traefik.http.routers.dev_api_uc-secure.service=dev_api_uc
      - traefik.http.services.dev_api_uc.loadbalancer.server.port=8000
      - traefik.docker.network=proxy
    networks:
      - proxy
    container_name: dev-api-uc
    restart: always

networks:
  proxy:
    external: true
